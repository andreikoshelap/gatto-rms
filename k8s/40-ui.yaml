apiVersion: v1
kind: Service
metadata:
  name: resource-ui
  namespace: rms
spec:
  selector:
    app: resource-ui
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-ui
  namespace: rms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-ui
  template:
    metadata:
      labels:
        app: resource-ui
    spec:
      containers:
        - name: ui
          image: rms/resource-ui:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          # If your UI nginx proxies /api to backend, keep that config in the image or mount a ConfigMap.

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: rms
spec:
  selector:
    app: kafka-ui
  ports:
    - name: http               # <-- this block was missing or mis-indented
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: rms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: local
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka:9092
            # Serve under /kafka-ui path behind Ingress
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: /kafka-ui
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: framework
