---
apiVersion: v1
kind: Service
metadata:
  name: resource-consumer
  namespace: rms
spec:
  selector: { app: resource-consumer }
  ports:
    - port: 8087
      targetPort: 8087

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-consumer
  namespace: rms
spec:
  replicas: 2   # <-- два консюмера в одной группе для распределения партиций и failover
  selector: { matchLabels: { app: resource-consumer } }
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels: { app: resource-consumer }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: consumer
          image: rms/resource-consumer:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef: { name: rms-config }
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            # рекомендуем зафиксировать group.id, чтобы оба пода были в одной группе
            - name: SPRING_KAFKA_CONSUMER_GROUP_ID
              value: resource-consumers
          # мягкое выключение: дайте приложению время закоммитить оффсеты
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          readinessProbe:
            tcpSocket: { port: 8087 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8087 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
