apiVersion: v1
kind: Service
metadata:
  name: resource-app
  namespace: rms
spec:
  selector: { app: resource-app }
  ports:
    - port: 8085
      targetPort: 8085

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-app
  namespace: rms
spec:
  replicas: 1
  selector: { matchLabels: { app: resource-app } }
  template:
    metadata: { labels: { app: resource-app } }
    spec:
      containers:
        - name: app
          image: rms/resource-service:local
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 8085 } ]
          envFrom:
            - configMapRef: { name: rms-config }
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: db-secret, key: POSTGRES_PASSWORD } }
          readinessProbe:
            tcpSocket: { port: 8085 }
            initialDelaySeconds: 10
            periodSeconds: 5

